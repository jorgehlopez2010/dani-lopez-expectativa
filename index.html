<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#180b17">
  <meta name="description" content="Dani López Boutique: próximamente nuestra tienda con Live Shopping y lives de moda. Encuéntranos en Instagram, TikTok y WhatsApp.">
  <title>Dani López Boutique | Próximamente · Live Shopping</title>
  <link rel="preload" as="image" href="campana-live-shopping.png">
  <style>
    :root {
      color-scheme: dark;
      --rose: #ee94be;
      --rose-soft: #f9c8df;
      --rose-muted: #b5638c;
      --ink: #180b17;
      --line: rgba(242,159,196,.63);
      --ease: cubic-bezier(.2,.72,.26,1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-width: 320px; background:var(--ink); }
    body {
      margin:0; min-height:100vh; padding:clamp(10px,2vw,26px);
      display:grid; place-items:center;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
      color:#fff8fb;
      background:radial-gradient(ellipse at 50% 35%,#4d1a3b 0%,#241020 51%,#0e090f 100%);
    }
    main { width:min(100%,960px); }
    .campaign {
      overflow:hidden; border-radius:clamp(14px,2vw,24px);
      border:1px solid rgba(241,167,202,.23);
      background:#1c0b19;
      box-shadow:0 24px 85px rgba(0,0,0,.36),0 0 33px rgba(198,85,141,.12);
    }
    .hero {display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
    .social-area {
      padding:clamp(20px,3vw,33px) clamp(16px,5vw,55px) clamp(26px,4vw,45px);
      text-align:center;
      background:linear-gradient(180deg,#271022 0%,#220e1d 32%,#160b15 100%);
      position:relative;
    }
    .social-area::before {
      content:"";position:absolute;top:0;left:14%;right:14%;height:1px;
      background:linear-gradient(90deg,transparent,rgba(245,161,200,.45),transparent);
    }
    .eyebrow {
      margin:0 0 24px; font-size:clamp(.78rem,1.5vw,1rem);
      font-weight:650;letter-spacing:.22em;text-transform:uppercase;
      color:#f6d6e6;
    }
    .social-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.5vw,18px)}
    .social-button {
      position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;
      gap:clamp(7px,1.1vw,14px);min-height:clamp(58px,7vw,76px);padding:12px 14px;
      border:1px solid var(--line);border-radius:999px;
      background:linear-gradient(145deg,rgba(74,30,55,.76),rgba(27,14,27,.96));
      color:#fff5fa;text-decoration:none;font-size:clamp(.95rem,1.6vw,1.15rem);font-weight:570;
      letter-spacing:.005em;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.18);
      outline:0;cursor:pointer;-webkit-tap-highlight-color:transparent;
      transition:transform 300ms var(--ease),background 300ms ease,color 300ms ease,
        border-color 300ms ease,box-shadow 300ms ease,opacity 300ms ease;
    }
    .social-button svg {width:clamp(23px,2.8vw,31px);height:clamp(23px,2.8vw,31px);flex:none;fill:currentColor;transition:transform 300ms var(--ease),color 300ms ease}
    .social-button:hover {
      transform:translateY(-3px) scale(1.035);
      color:#fff;
      border-color:#ffd4e6;
      background:linear-gradient(145deg,#8f456c,#51283f 65%,#3a1b31);
      box-shadow:0 9px 28px rgba(195,91,142,.25),0 0 0 1px rgba(248,176,212,.23),inset 0 1px 0 rgba(255,255,255,.25);
    }
    .social-button:hover svg {transform:scale(1.07)}
    .social-button:focus-visible {
      transform:translateY(-2px) scale(1.025);
      border-color:#ffe5ef;outline:3px solid #ffd0e5;outline-offset:4px;
      background:linear-gradient(145deg,#874167,#47243e);
    }
    .social-button:active {transform:translateY(0) scale(.975);background:#a0517c;box-shadow:inset 0 3px 10px rgba(0,0,0,.23)}
    .social-button:disabled,.social-button[aria-disabled="true"] {
      cursor:not-allowed;opacity:.42;filter:saturate(.4);transform:none;box-shadow:none;
    }
    .social-button:disabled:hover,.social-button[aria-disabled="true"]:hover {
      transform:none;background:linear-gradient(145deg,rgba(74,30,55,.76),rgba(27,14,27,.96));border-color:var(--line);box-shadow:none;
    }
    .footer {margin:18px 0 0;text-align:center;font-size:.76rem;color:#c6a4b8;letter-spacing:.02em}
    @media(max-width:590px) {
      .social-grid{grid-template-columns:1fr;gap:12px;max-width:390px;margin:auto}
      .social-button{min-height:58px;font-size:1.03rem;}
      .eyebrow{line-height:1.6;letter-spacing:.16em;margin-bottom:20px}
    }
    @media(prefers-reduced-motion:reduce) {
      .social-button,.social-button svg{transition:none!important}
    }
  </style>
</head>

            <span>WhatsApp</span>
          </a>
        </div>
        <p class="footer">Muy pronto: moda, estilo y compras en vivo.</p>
      </nav>
    </div>
  </main>
</body>
</html>
